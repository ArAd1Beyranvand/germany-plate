name: germany_plate_example
description: Minimal example — a German car plate with advisory validation.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  core_plate: ^0.1.0
  germany_plate: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

# Local development only — resolves the germany_plate package from the sibling
# checkout until it is published on pub.dev. A fresh consumer copying this
# example deletes this block and relies on the versioned dependencies above.
dependency_overrides:
  # Local development only: this stage's PlateController/PlateView API is not
  # published yet, so core_plate resolves to the sibling checkout.
  core_plate:
    path: ../../core_plate
  germany_plate:
    path: ../

