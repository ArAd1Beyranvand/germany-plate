name: germany_plate_example
description: Minimal example — a German car plate with advisory validation.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  core_plate: ^0.1.0
  germany_plate: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

dependency_overrides:
  core_plate:
    path: ../../core-plate
  germany_plate:
    path: ../
