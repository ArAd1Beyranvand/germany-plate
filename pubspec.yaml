name: germany_plate
description: "Germany's licence plates for the plate_number / core_plate library — the country panel, the car spec with its EU stickers, and the German plate validator."
version: 0.1.0
homepage: https://github.com/ArAdBey/plate-number

# Provisional: the core dependency is a path during development, which is
# incompatible with publishing. P9 decides pub.dev vs path-only (PLAN.md §6.6);
# if it picks pub.dev this line goes and `plate_number` becomes a version range.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The core package. Still named `plate_number`; becomes `core_plate` in P9 of
  # the split, at which point this one line changes.
  plate_number:
    path: ../plate-core

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # This package OWNS the images it names. The `AssetImage(..., package:
  # 'germany_plate')` decals and `GermanyCountry.germany`'s flag resolve against
  # the bundle of the package that declares them — so those literals and this
  # block have to move together or they silently keep working off a stale bundle
  # locally and fail for a fresh consumer.
  assets:
    - assets/de_inspection_sticker.png
    - assets/de_state_seal.png
    - assets/flags/Flag_of_Germany.svg
